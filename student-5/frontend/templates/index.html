<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Career and Internship</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <nav>
      <h2>Career&Internship</h2>

      <div>
        <a href="/">Jobs</a>

        <a href="/dashboard.html"> Dashboard </a>

        <a href="/preferences.html"> Preferences </a>

        <a href="/admin.html"> Admin </a>
      </div>
    </nav>

    <main>
      <section class="hero">
        <h1>Find your next opportunity</h1>

        <p>
          Discover jobs and internships that match your skills and career goals.
        </p>
      </section>

      <section class="search-section">
        <input id="search" placeholder="Search jobs..." />

        <select id="location">
          <option value="">All Locations</option>

          <option>Sydney</option>
          <option>Melbourne</option>
          <option>Brisbane</option>
        </select>

        <select id="industry">
          <option value="">All Industries</option>

          <option>Technology</option>
          <option>Finance</option>
          <option>Marketing</option>
          <option>Education</option>
        </select>

        <select id="job-type">
          <option value="">All Types</option>

          <option>Internship</option>
          <option>Graduate</option>
          <option>Part-time</option>
          <option>Full-time</option>
        </select>

        <button onclick="searchJobs()">Search</button>
      </section>

      <div id="jobs-message" class="message"></div>

      <section>
        <h2>Available Opportunities</h2>

        <div id="job-list" class="job-grid"></div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>

    <script src="{{ url_for('static', filename='js/jobs.js') }}"></script>
  </body>
</html>

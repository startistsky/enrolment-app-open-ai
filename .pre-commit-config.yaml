minimum_pre_commit_version: '4.0.0'
# Generated artifacts and local environments are not source evidence.
exclude: '(^|/)(\.venv[^/]*|venv|env|__pycache__|chroma[^/]*|docker-data|ollama-data)/|\.jsonl$'
repos:
  - repo: local
    hooks:
      - id: security-scans
        name: Security Scans and Report
        entry: python scripts/run_security_scans.py
        language: python
        additional_dependencies:
          - ruff==0.16.10
          - detect-secrets==1.5.0
          - pip-audit==2.10.1
        pass_filenames: false
        always_run: true

      - id: student-4-pytest
        name: Student 4 Pre-commit Pytest
        entry: python -m pytest student-4/tests/ -q
        language: python
        # pre-commit owns this environment; no developer-local .venv is required.
        additional_dependencies:
          - pytest
          - Flask
          - requests
          - mcp==2.2.0
          - httpx
        pass_filenames: false
        files: ^student-4/

# Student 4 Docker Compose Configuration
services:
  database:
    build:
      context: .
      dockerfile: student-4/database/Dockerfile

    ports:
      - "5002:5002"

    environment:
      DATABASE_PATH: /data/events.db

    volumes:
      - database_data:/data

  backend:
    build:
      context: .
      dockerfile: student-4/backend/Dockerfile

    ports:
      - "8000:8000"

    environment:
      AI_SERVICE_URL: http://ollama:11434/api/generate
      DATABASE_SERVICE_URL: http://database:5002

    depends_on:
      - database
      - ollama

  frontend:
    build:
      context: .
      dockerfile: student-4/frontend/Dockerfile

    ports:
      - "8080:80"

    depends_on:
      - backend

  shared-frontend:
    build:
      context: .
      dockerfile: shared/frontend/Dockerfile

    ports:
      - "8888:80"

  ollama:
    image: ollama/ollama:latest

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

volumes:
  database_data:
  ollama_data:
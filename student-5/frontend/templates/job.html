<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Job Details | CareerConnect</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <header class="topbar">
      <a href="/" class="brand">
        <span class="brand-mark"></span>

        <span>CareerConnect</span>
      </a>

      <nav class="nav">
        <a href="/">Jobs</a>

        <a href="/dashboard.html"> Dashboard </a>

        <a href="/admin.html"> Admin </a>
      </nav>
    </header>

    <main>
      <div id="job-details">
        <p>Loading job...</p>
      </div>

      <div class="actions">
        <button onclick="saveJob()" class="secondary-button">Save Job</button>

        <button onclick="applyJob()" class="primary-button">Apply</button>

        <button onclick="analyseJob()" class="primary-button">
          Analyse with AI
        </button>
      </div>

      <p id="job-action-message"></p>

      <section class="ai-section">
        <span class="section-label"> AI ANALYSIS </span>

        <h2>Job Analysis</h2>

        <div id="ai-analysis">
          <p>Select "Analyse with AI" to analyse the job requirements.</p>
        </div>
      </section>

      <section class="chat">
        <span class="section-label"> CAREER ASSISTANT </span>

        <h2>Ask the Career Agent</h2>

        <div id="chat-messages"></div>

        <div class="chat-input">
          <input id="chat-input" placeholder="Ask about this job..." />

          <button onclick="sendMessage()">Send</button>
        </div>

        <p id="chat-message"></p>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>

    <script src="{{ url_for('static', filename='js/job.js') }}"></script>
  </body>
</html>

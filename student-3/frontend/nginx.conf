server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /resources { proxy_pass http://student3-backend:8000; }
    location /recommend { proxy_pass http://student3-backend:8000; }
    location /rag/ { proxy_pass http://student3-backend:8000; }
    location /api/multi-agent/ {
        proxy_pass http://student3-backend:8000;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
    location /api/ { proxy_pass http://student3-backend:8000; }
    location / { try_files $uri $uri/ /index.html; }
}

minimum_pre_commit_version: '4.0.0'
# Generated artifacts and local environments are not source evidence.
exclude: '(^|/)(\.venv[^/]*|venv|env|__pycache__|chroma[^/]*|docker-data|ollama-data)/|\.jsonl$'
repos:
  - repo: local
    hooks:
      - id: ruff-security
        name: Ruff Security
        entry: ruff check --config ruff.toml student-1 ai-services/multi-agent-server mcp-server rag-server shared scripts
        language: python
        additional_dependencies: ['ruff==0.16.10']
        pass_filenames: false
        always_run: true
      - id: detect-secrets
        name: Detect Secrets
        entry: detect-secrets-hook --baseline .secrets.baseline
        language: python
        additional_dependencies: ['detect-secrets==1.5.0']
        exclude: '^\.secrets\.baseline$'
      - id: pip-audit
        name: Dependency Audit
        entry: python scripts/security_pip_audit.py --gate
        language: python
        additional_dependencies: ['pip-audit==2.10.1']
        pass_filenames: false
        always_run: true

name: Student 3 Campus Resource CI

on:
  push:
    branches:
      - student_3
      - feature/student3-r1-resource

  pull_request:
    branches:
      - main

jobs:
  student3-tests:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests flask flask-cors mcp httpx
          pip install -r rag-server/requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile student-3/backend/app.py
          python -m py_compile student-3/backend/rag_client.py
          python -m py_compile student-3/backend/mcp_client.py
          python -m py_compile student-3/backend/agentic_loop.py
          python -m py_compile student-3/database/database_api.py
          python -m py_compile student-3/database/init_db.py
          python -m py_compile mcp-server/tools/student3_resource_tools.py
          python -m py_compile rag-server/retrievers/student3_resource_retriever.py
          python -m py_compile student-3/tests/test_mcp_integration.py
          python -m py_compile student-3/tests/test_rag_integration.py

      - name: Build Student 3 Docker services
        run: |
          docker compose build student3-database student3-backend

      - name: Start Student 3 services
        run: |
          docker compose up -d ollama student3-database student3-backend

      - name: Pull Qwen model
        run: |
          docker compose exec -T ollama ollama pull qwen2.5:0.5b

      - name: Wait for services
        run: |
          sleep 15

      - name: Check running containers
        run: |
          docker compose ps

      - name: Test database health
        run: |
          curl --fail http://localhost:5004/health

      - name: Test backend health
        run: |
          curl --fail http://localhost:8003/health

      - name: Run Student 3 automated tests
        run: |
          python -m pytest student-3/tests -v

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose logs student3-database
          docker compose logs student3-backend
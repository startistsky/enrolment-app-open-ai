name: Student 5 Career and Internship Management CI

on:
  push:
    branches:
      - new-student-5

  pull_request:
    branches:
      - main

jobs:
  student5-tests:
    name: Student 5 CI
    runs-on: ubuntu-latest

    steps:
      # checkout
      - name: Checkout repository
        uses: actions/checkout@v4

        # setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

        # install dependencies
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-5/backend/requirements.txt

      # check Python syntax
      - name: Check Python syntax
        run: |
          python -m py_compile student-5/backend/app.py
          python -m py_compile student-5/backend/agent/agent.py
          python -m py_compile student-5/backend/agent/agent_tools.py
          python -m py_compile student-5/backend/agent/ai_routes.py
          python -m py_compile student-5/backend/agent/ai_service.py
          python -m py_compile student-5/backend/crud/service.py
          python -m py_compile student-5/backend/model/database.py
          python -m py_compile student-5/backend/model/seed.py

      # Docker compose validation
      - name: Validate Docker Compose
        run: |
          docker compose config

      # Build
      - name: Build Student 5 Docker services
        run: |
          docker compose build student5-database student5-backend student5-frontend

      # Show build evidence
      - name: Show Student 5 Docker images
        run: |
          docker images | grep student5 || true

      # Run services
      - name: Start services
        run: |
          docker compose up -d \
            student5-database \
            student5-backend \
            student5-frontend \
            ollama

      # Show inital status
      - name: Show running containers
        run: |
          docker compose ps

      # Multi agent workflow test
      - name: Run Student 5 Career Workflow tests
        run: |
          PYTHONPATH=ai-services/multi-agent-server \
          python -m pytest \
            ai-services/multi-agent-server/tests/test_student5_career_workflow.py \
            -v

      - name: Show final container status
        if: always()
        run: |
          docker compose ps

      # Failure log
      - name: Show Docker logs on failure
        if: failure()
        run: |
          echo "Student 5 Backend Logs"
          docker compose logs student5-backend || true

          echo "Student 5 Database Logs"
          docker compose logs student5-database || true

          echo "Ollama Logs"
          docker compose logs ollama || true

          echo "Docker Compose Status"
          docker compose ps

      - name: Stop Docker services
        if: always()
        run: |
          docker compose down -v



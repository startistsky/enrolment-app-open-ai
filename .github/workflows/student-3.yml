name: Student 3 Campus Resource CI

on:
  push:
    branches:
      - student_3
      - "feature/student3-*"

  pull_request:
    branches:
      - main

jobs:
  student3-tests:
    name: Student 3 CI
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Student 3 test dependencies
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests flask flask-cors mcp httpx chromadb sentence-transformers

      # Check Student 3 Python syntax
      - name: Check Python syntax
        run: |
          python -m py_compile student-3/backend/app.py
          python -m py_compile student-3/backend/rag_client.py
          python -m py_compile student-3/backend/mcp_client.py
          python -m py_compile student-3/backend/agentic_loop.py
          python -m py_compile student-3/database/database_api.py
          python -m py_compile student-3/database/init_db.py
          python -m py_compile mcp-server/tools/student3_resource_tools.py
          python -m py_compile rag-server/retrievers/student3_resource_retriever.py
          python -m py_compile student-3/tests/test_mcp_integration.py
          python -m py_compile student-3/tests/test_rag_integration.py

      # Build Student 3 Docker services
      - name: Build Student 3 Docker services
        run: |
          docker compose build student3-database student3-backend

      # Diagnose disk usage before Ollama is pulled
      - name: Check disk space before Ollama
        run: |
          echo "===== DISK SPACE ====="
          df -h

          echo ""
          echo "===== DOCKER DISK USAGE ====="
          docker system df

          echo ""
          echo "===== DOCKER IMAGES ====="
          docker images

      # Start Student 3 services
      - name: Start Student 3 services
        run: |
          docker compose up -d ollama student3-database student3-backend

      # Pull Qwen model
      - name: Pull Qwen model
        run: |
          docker compose exec -T ollama ollama pull qwen2.5:0.5b

      # Wait for services
      - name: Wait for services
        run: |
          echo "Waiting for Student 3 services to start..."
          sleep 15

      # Check running containers
      - name: Check running containers
        run: |
          docker compose ps

      # Test database health
      - name: Test database health
        run: |
          curl --fail --retry 5 --retry-delay 3 \
            http://localhost:5004/health

      # Test backend health
      - name: Test backend health
        run: |
          curl --fail --retry 5 --retry-delay 3 \
            http://localhost:8003/health

      # Run all Student 3 tests
      - name: Run Student 3 CI tests
        run: |
          python -m pytest \
            student-3/tests/test_ai.py \
            student-3/tests/test_backend.py \
            student-3/tests/test_database.py \
            student-3/tests/test_mcp_integration.py \
            student-3/tests/test_rag_integration.py \
            -v

      # Show diagnostic information if CI fails
      - name: Show diagnostics on failure
        if: failure()
        run: |
          echo "===== DISK SPACE AFTER FAILURE ====="
          df -h || true

          echo ""
          echo "===== DOCKER DISK USAGE ====="
          docker system df || true

          echo ""
          echo "===== DOCKER CONTAINERS ====="
          docker compose ps || true

          echo ""
          echo "===== STUDENT 3 DATABASE LOGS ====="
          docker compose logs student3-database || true

          echo ""
          echo "===== STUDENT 3 BACKEND LOGS ====="
          docker compose logs student3-backend || true

          echo ""
          echo "===== OLLAMA LOGS ====="
          docker compose logs ollama || true

      # Clean up Docker services
      - name: Stop Docker services
        if: always()
        run: |
          docker compose down -v
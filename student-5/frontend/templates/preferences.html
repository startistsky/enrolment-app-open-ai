<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Career Preferences</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <nav>
      <h2>Career&Internship</h2>

      <div>
        <a href="/">Jobs</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/preferences.html">Preferences</a>
        <a href="/admin.html">Admin</a>
      </div>
    </nav>

    <main>
      <h1>Career Preferences</h1>

      <p>Tell us what opportunities you are looking for.</p>

      <div id="preferences-message" class="message"></div>

      <form id="preferences-form">
        <label> Preferred Locations </label>

        <input id="locations" placeholder="Sydney, Melbourne" />

        <label> Preferred Industries </label>

        <input id="industries" placeholder="Technology, Finance" />

        <label> Job Types </label>

        <input id="job-types" placeholder="Internship, Graduate" />

        <label> Your Skills </label>

        <textarea id="skills" placeholder="Python, SQL, JavaScript"></textarea>

        <label> Career Goals </label>

        <textarea
          id="career-goals"
          placeholder="Become a software engineer"
        ></textarea>

        <div class="actions">
          <button type="submit">Save Preferences</button>

          <button
            type="button"
            class="secondary-button"
            onclick="clearPreferences()"
          >
            Clear
          </button>
        </div>
      </form>

      <section>
        <h2>Recommended For You</h2>

        <p>
          These opportunities are matched against your preferences and skills.
        </p>

        <div id="recommendations" class="job-grid"></div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>

    <script src="{{ url_for('static', filename='js/preferences.js') }}"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Job Details</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav>

    <h2>CareerConnect</h2>

    <div>
        <a href="index.html">Jobs</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="preferences.html">Preferences</a>
    </div>

</nav>


<main>

    <div id="job-details">

        <!-- JavaScript loads job -->

    </div>


    <div class="actions">

        <button onclick="saveJob()">
            Save Job
        </button>

        <button onclick="applyJob()">
            Apply
        </button>

        <button onclick="analyseJob()">
            Analyse with AI
        </button>

    </div>


    <!-- AI Analysis -->

    <section class="ai-section">

        <h2>AI Job Analysis</h2>

        <div id="ai-analysis">

            <p>
                Click "Analyse with AI" to see:
            </p>

            <ul>
                <li>Required skills</li>
                <li>Qualifications</li>
                <li>Experience</li>
                <li>ATS keywords</li>
                <li>Job summary</li>
            </ul>

        </div>

    </section>


    <!-- AI Chat -->

    <section class="chat">

        <h2>AI Career Assistant</h2>

        <div id="chat-messages"></div>

        <div class="chat-input">

            <input
                id="chat-input"
                placeholder="Ask about this job..."
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </section>

</main>


<script src="js/api.js"></script>
<script src="js/job.js"></script>

</body>

</html>

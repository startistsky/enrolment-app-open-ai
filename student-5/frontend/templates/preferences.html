<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Career Profile | CareerConnect</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <header class="topbar">
      <a href="/" class="brand">
        <span class="brand-mark"></span>

        <span>CareerConnect</span>
      </a>

      <nav class="nav">
        <a href="/">Jobs</a>

        <a href="/dashboard.html"> Dashboard </a>

        <a href="/admin.html"> Admin </a>
      </nav>
    </header>

    <main>
      <section class="hero small-hero">
        <span class="eyebrow"> CAREER PROFILE </span>

        <h1>Your Career Profile</h1>

        <p>
          Update the information used by the Career Agent to find suitable
          opportunities.
        </p>
      </section>

      <form id="preferences-form">
        <div class="form-group">
          <label> Preferred Locations </label>

          <input id="locations" placeholder="Sydney, Melbourne" />
        </div>

        <div class="form-group">
          <label> Preferred Industries </label>

          <input id="industries" placeholder="Technology, Finance" />
        </div>

        <div class="form-group">
          <label> Job Types </label>

          <input id="job-types" placeholder="Internship, Graduate" />
        </div>

        <div class="form-group">
          <label> Skills </label>

          <textarea
            id="skills"
            placeholder="Python, SQL, JavaScript..."
          ></textarea>
        </div>

        <div class="form-group">
          <label> Career Goals </label>

          <textarea
            id="career-goals"
            placeholder="Become a software engineer..."
          ></textarea>
        </div>

        <button type="submit" class="primary-button">
          Save Career Profile
        </button>

        <p id="preferences-message"></p>
      </form>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>

    <script src="{{ url_for('static', filename='js/preferences.js') }}"></script>
  </body>
</html>

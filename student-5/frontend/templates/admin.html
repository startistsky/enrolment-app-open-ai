<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CareerConnect Admin</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <header class="topbar">
      <a href="/" class="brand">
        <span class="brand-mark"></span>
        <span>CareerConnect</span>
      </a>

      <nav class="nav">
        <a href="/">Jobs</a>
        <a href="/dashboard.html"> Dashboard </a>
        <a href="/admin.html"> Admin </a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>Admin Job Management</h1>

        <p>Create, edit and delete career opportunities.</p>
      </section>

      <!-- Status -->

      <div id="admin-status" class="status-message" style="display: none"></div>

      <!-- Job Form -->

      <form id="job-form">
        <h2>Add / Edit Job</h2>

        <label> Job Title </label>

        <input
          id="title"
          type="text"
          required
          placeholder="Frontend Developer"
        />

        <label> Company </label>

        <input
          id="company"
          type="text"
          required
          placeholder="Example Company"
        />

        <label> Location </label>

        <input id="location" type="text" placeholder="Sydney" />

        <label> Industry </label>

        <input id="industry" type="text" placeholder="Technology" />

        <label> Job Type </label>

        <input id="job-type" type="text" placeholder="Internship" />

        <label> Description </label>

        <textarea
          id="description"
          placeholder="Describe the role..."
        ></textarea>

        <label> Requirements </label>

        <textarea
          id="requirements"
          placeholder="HTML, CSS, JavaScript..."
        ></textarea>

        <label> Salary </label>

        <input id="salary" type="text" placeholder="$60,000 - $70,000" />

        <label> Application URL </label>

        <input
          id="application-url"
          type="url"
          placeholder="https://example.com/apply"
        />

        <div class="admin-actions">
          <button id="job-submit" type="submit">Create Job</button>

          <button
            id="cancel-edit"
            type="button"
            style="display: none"
            onclick="cancelEdit()"
          >
            Cancel Edit
          </button>
        </div>
      </form>

      <!-- Existing Jobs -->

      <section>
        <h2>Existing Jobs</h2>

        <div id="admin-jobs" class="job-grid"></div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>

    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
  </body>
</html>

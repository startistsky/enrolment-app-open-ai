name: Student 5 Career and Internship Management CI

on:
  push:
    branches:
      - new-student-5

  pull_request:
    branches:
      - main

jobs:
  student5-tests:
    name: Student 5 CI
    runs-on: ubuntu-latest

    steps:
      # checkout
      - name: Checkout repository
        uses: actions/checkout@v4

        # setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

        # install dependencies
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-5/backend/requirements.txt

      # check Python syntax
      - name: Check Python syntax
        run: |
          python -m py_compile student-5/backend/app.py
          python -m py_compile student-5/backend/agent/agent.py
          python -m py_compile student-5/backend/agent/agent_tools.py
          python -m py_compile student-5/backend/agent/ai_routes.py
          python -m py_compile student-5/backend/agent/ai_service.py
          python -m py_compile student-5/backend/crud/service.py
          python -m py_compile student-5/backend/model/database.py
          python -m py_compile student-5/backend/model/seed.py

      # tests
      - name: Run Student 5 tests
        run: |
          cd student-5
          export PYTHONPATH="$PWD/backend"

          python -m pytest tests/ \
            --ignore=tests/test_rag_mcp.py \
            -v

      # Docker compose validation
      - name: Validate Docker Compose
        run: |
          docker compose config

      # Build
      - name: Build Student 5 Docker services
        run: |
          docker compose build student5-database student5-backend

      - name: Start services
        run: |
          docker compose up -d \
            student5-database \
            student5-backend \
            ollama

      # Show inital status
      - name: Show running containers
        run: |
          docker compose ps

      # Wait for services
      - name: Wait for Student 5 services
        run: |
          echo "Waiting for Student 5 services..."

          for i in {1..30}; do
            if curl -fsS http://localhost:8005/health > /dev/null 2>&1; then
              echo "Student 5 backend is ready."
              break
            fi

            echo "Waiting for backend... attempt $i/30"
            sleep 2
          done

      # Backend health
      - name: Test backend health
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:8005/health

      # Jobs api
      - name: Test Jobs endpoint
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:8005/api/jobs

      # Run MCP server
      - name: Check shared MCP server
        run: |
          echo "Checking MCP server..."

          curl --fail \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:9001/mcp

      # RUn RAG server
      - name: Check shared RAG server
        run: |
          echo "Checking RAG server..."

          curl --fail \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:9101

      - name: Show final container status
        if: always()
        run: |
          docker compose ps

      # Failure log
      - name: Show Docker logs on failure
        if: failure()
        run: |
          echo "Student 5 Backend Logs"
          docker compose logs student5-backend || true

          echo "Student 5 Database Logs"
          docker compose logs student5-database || true

          echo "Ollama Logs"
          docker compose logs ollama || true

          echo "Docker Compose Status"
          docker compose ps

      - name: Stop Docker services
        if: always()
        run: |
          docker compose down -v

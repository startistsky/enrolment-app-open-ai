# Integrated Docker Compose Configuration

services:

  # =========================
  # Student 3 - Database
  # =========================
  student3-database:
    build:
      context: .
      dockerfile: student-3/database/Dockerfile

    ports:
      - "5004:5004"


  # =========================
  # Student 3 - Backend
  # =========================
  student3-backend:
    build:
      context: .
      dockerfile: student-3/backend/Dockerfile

    ports:
      - "8003:8000"

    environment:
      DATABASE_API_URL: http://student3-database:5004
      AI_SERVICE_URL: http://ollama:11434/api/generate

    depends_on:
      - student3-database
      - ollama


  # =========================
  # Student 3 - Frontend
  # =========================
  student3-frontend:
    build:
      context: .
      dockerfile: student-3/frontend/Dockerfile

    ports:
      - "8083:80"

    depends_on:
      - student3-backend


  # =========================
  # Student 4 - Database
  # =========================
  database:
    build:
      context: .
      dockerfile: student-4/database/Dockerfile

    ports:
      - "5002:5002"

    environment:
      DATABASE_PATH: /data/events.db

    volumes:
      - database_data:/data


  # =========================
  # Student 4 - Backend
  # =========================
  backend:
    build:
      context: .
      dockerfile: student-4/backend/Dockerfile

    ports:
      - "8000:8000"

    environment:
      AI_SERVICE_URL: http://ollama:11434/api/generate
      DATABASE_SERVICE_URL: http://database:5002

    depends_on:
      - database
      - ollama


  # =========================
  # Student 4 - Frontend
  # =========================
  frontend:
    build:
      context: .
      dockerfile: student-4/frontend/Dockerfile

    ports:
      - "8080:80"

    depends_on:
      - backend


  # =========================
  # Shared Ollama
  # =========================
  ollama:
    image: ollama/ollama:latest

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama


volumes:
  database_data:
  ollama_data:
server {
    listen 80;
    server_name _;

    # Frontend files
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API/backend requests to Flask
    location /api/ {
        proxy_pass http://student5-backend:8005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # If app.py serves Flask routes/templates,
    # send those requests to Flask too.
    location / {
        proxy_pass http://student5-backend:8005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static frontend assets can be served directly by nginx
    location /shared/ {
        alias /usr/share/nginx/html/shared/;
    }
}

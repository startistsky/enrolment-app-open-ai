services:

  # B2 - Cloud MCP

  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    environment:
      STUDENT1_BACKEND_URL: http://student1-backend:8001
      STUDENT2_BACKEND_URL: http://student2-backend:8002
      STUDENT3_DATABASE_API_URL: http://student3-database:5004
      STUDENT4_BACKEND_URL: http://backend:8000
      CAREER_BACKEND_URL: http://student5-backend:8006
    expose:
      - "9001"
    depends_on:
      - student3-database
      - student5-backend
    restart: unless-stopped

  # B1 - Cloud AI

  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    volumes:
      - ollama_bonus_data:/root/.ollama
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        until ollama list >/dev/null 2>&1; do
          echo "Waiting for Ollama..."
          sleep 2
        done
        ollama pull qwen2.5:0.5b
        echo "Qwen model is ready."

  # B3 - Cloud RAG
  rag-server:
    build:
      context: .
      dockerfile: rag-server/Dockerfile.bonus
    environment:
      STUDENT1_BACKEND_URL: http://student1-backend:8001
      STUDENT2_BACKEND_URL: http://student2-backend:8002
      STUDENT4_BACKEND_URL: http://backend:8000
    expose:
      - "9101"
    volumes:
      - rag_bonus_chroma:/app/chroma
      - rag_bonus_chroma_data:/app/chroma-data
    depends_on:
      rag-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # B3 - Initialise RAG Knowledge from S3 and S5
  rag-init:
    build:
      context: .
      dockerfile: rag-server/Dockerfile.bonus
    command:
      - python
      - -c
      - "from retrievers.student3_resource_retriever import index_knowledge as index_resources; from retrievers.student5_career_retriever import ensure_knowledge_indexed as ensure_career; resource_result=index_resources(); career_result=ensure_career(); print(resource_result); print(career_result); assert resource_result.get('status') == 'indexed'; assert career_result.get('success') is True"
    volumes:
      - rag_bonus_chroma:/app/chroma
      - rag_bonus_chroma_data:/app/chroma-data
    restart: "no"

  # B4 - Cloud Multi-Agent
  multi-agent-server:
    build:
      context: .
      dockerfile: ai-services/multi-agent-server/Dockerfile.bonus
    environment:
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_REVIEW_MODEL: qwen2.5:0.5b
      WORKFLOW_HISTORY_PATH: /app/data/workflow_history.jsonl
      COORDINATION_AUDIT_PATH: /app/data/coordination_audit.jsonl
    expose:
      - "9201"
    volumes:
      - multi_agent_bonus_data:/app/data
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Student 1 Course Integration
  student1-backend:
    environment:
      AI_SERVICES_ENABLED: 'true'
      AI_SERVICE_URL: http://ollama:11434/api/generate
      AI_MODEL: qwen2.5:0.5b
      MCP_SERVER_URL: http://mcp-server:9001/mcp
      RAG_SERVER_URL: http://rag-server:9101
      MULTI_AGENT_SERVER_URL: http://multi-agent-server:9201
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      mcp-server:
        condition: service_started
      rag-server:
        condition: service_started
      multi-agent-server:
        condition: service_started

  # Student 2 Assignment Integration
  student2-backend:
    environment:
      AI_SERVICES_ENABLED: 'true'
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: qwen2.5:0.5b
      RAG_SERVER_URL: http://rag-server:9101
      MULTI_AGENT_SERVER_URL: http://multi-agent-server:9201
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      rag-server:
        condition: service_started
      multi-agent-server:
        condition: service_started

  # Student 3 Backend Integration

  student3-backend:
    environment:
      AI_SERVICES_ENABLED: 'true'
      AI_SERVICE_URL: http://ollama:11434/api/generate
      AI_MODEL: qwen2.5:0.5b
      MCP_SERVER_URL: http://mcp-server:9001/mcp
      RAG_SERVER_URL: http://rag-server:9101
      MULTI_AGENT_SERVICE_URL: http://multi-agent-server:9201
    depends_on:
      mcp-server:
        condition: service_started

  # Student 4 Event Integration
  backend:
    environment:
      AI_SERVICES_ENABLED: 'true'
      MULTI_AGENT_ENABLED: 'true'
      AI_SERVICE_URL: http://ollama:11434/api/generate
      MODEL_NAME: qwen2.5:0.5b
      MCP_SERVER_URL: http://mcp-server:9001/mcp
      RAG_SERVER_URL: http://rag-server:9101
      MULTI_AGENT_SERVER_URL: http://multi-agent-server:9201
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      mcp-server:
        condition: service_started
      rag-server:
        condition: service_started
      multi-agent-server:
        condition: service_started


  # Student 5 Career Integration
  student5-backend:
    environment:
      AI_SERVICES_ENABLED: 'true'
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b
      OLLAMA_SMART_MODEL: qwen2.5:0.5b
      MCP_SERVER_URL: http://mcp-server:9001/mcp
      RAG_SERVER_URL: http://rag-server:9101
      MULTI_AGENT_SERVER_URL: http://multi-agent-server:9201
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      rag-init:
        condition: service_completed_successfully
      rag-server:
        condition: service_started
      multi-agent-server:
        condition: service_started

volumes:
  ollama_bonus_data:
  rag_bonus_chroma:
  rag_bonus_chroma_data:
  multi_agent_bonus_data:

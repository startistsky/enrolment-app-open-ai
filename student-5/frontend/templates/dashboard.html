<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard | CareerConnect</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <header class="topbar">
      <a href="/" class="brand">
        <span class="brand-mark"></span>

        <span>CareerConnect</span>
      </a>

      <nav class="nav">
        <a href="/">Jobs</a>

        <a href="/dashboard.html"> Dashboard </a>

        <a href="/admin.html"> Admin </a>
      </nav>
    </header>

    <main>
      <section class="hero small-hero">
        <span class="eyebrow"> YOUR CAREER </span>

        <h1>Career Dashboard</h1>

        <p>Manage saved opportunities and track your applications.</p>
      </section>

      <!-- Saved Jobs -->

      <section>
        <div class="section-head">
          <div>
            <span class="section-label"> SAVED </span>

            <h2>Saved Jobs</h2>
          </div>
        </div>

        <div id="saved-jobs" class="job-grid"></div>
      </section>

      <!-- Applications -->

      <section>
        <div class="section-head">
          <div>
            <span class="section-label"> APPLICATIONS </span>

            <h2>My Applications</h2>
          </div>
        </div>

        <div id="applications"></div>
      </section>

      <p id="dashboard-message"></p>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  </body>
</html>

name: Student 5 Career and Internship Management CI

on:
  push:
    branches:
      - new-student-5

  pull_request:
    branches:
      - main

jobs:
  student5-tests:
    name: Student 5 CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # setup python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # install backend dependecies
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-5/backend/requirements.txt

        # run automated test
      - name: Run Student 5 tests
        run: |
          cd student-5
          export PYTHONPATH="$PWD/backend"
          python -m pytest tests/ -v

      # build student 5 image using the shared docker
      - name: Build Student 5 Docker images
        run: |
          docker compose build database backend frontend

      # start student 5 service
      - name: Start Student 5 services
        run: |
          docker compose up -d database ollama backend frontend

      # show container status for CI evidence/debugging
      - name: Show running containers
        run: |
          docker compose ps

      # check syntax
      - name: Check Python syntax
        run: |
          python -m py_compile student-5/backend/app.py
          python -m py_compile student-5/backend/agent/agent.py
          python -m py_compile student-5/backend/agent/agent_tools.py
          python -m py_compile student-5/backend/agent/ai_routes.py
          python -m py_compile student-5/backend/agent/ai_service.py
          python -m py_compile student-5/backend/crud/service.py
          python -m py_compile student-5/backend/model/database.py
          python -m py_compile student-5/backend/model/seed.py

      # validation configuration
      - name: Validate Docker Compose
        run: |
          docker compose config

      # build docker service
      - name: Build Student 5 Docker services
        run: |
          docker compose build student5-database student5-backend

      # start
      - name: Start Student 5 Docker services
        run: |
          docker compose up -d student5-database student5-backend

      # wait for service to start
      - name: Wait for services
        run: |
          echo "Waiting for Student 5 services to start..."
          sleep 15

      # check container
      - name: Check running containers
        run: |
          docker compose ps

      # test health
      - name: Test backend health
        run: |
          curl --fail --retry 5 --retry-delay 5 http://localhost:8005/health

      - name: Test Jobs endpoints
        run: |
          curl --fail --retry 10 --retry-delay 3 \
            http://localhost:8005/api/jobs

      # check MCP
      - name: Check shared MCP server
        run: |
          curl --fail --retry 10 --retry-delay 3 \
            http://localhost:9001/mcp

      # check RAG
      - name: Check shared RAG server
        run: |
          curl --fail --retry 10 --retry-delay 3 \
            http://localhost:9101

      # show failure logs
      - name: Show Docker logs on failure
        if: failure()
        run: |
          echo "Student 5 Database Logs"
          docker compose logs student5-database || true

          echo "Student 5 Backend Logs
          docker compose logs student5-backend || true

          echo "Docker Compose Status"
          docker compose ps

      # stop Docker service
      - name: Stop Docker services
        if: always()
        run: |
          docker compose down -v

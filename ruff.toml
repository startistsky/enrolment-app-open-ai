extend-exclude = [".venv*", "venv", "env", "__pycache__", "chroma", "chroma-data", "docker-data", "ollama-data", "*.jsonl"]

[lint]
select = ["S"]

[lint.per-file-ignores]
# pytest assertions are test expectations, never production input validation.
"student-1/tests/*.py" = ["S101"]
"student-2/tests/*.py" = ["S101"]
# Both Flask services intentionally bind all interfaces inside their containers.
"student-2/backend/app.py" = ["S104"]
"student-2/database/app.py" = ["S104"]
"ai-services/multi-agent-server/tests/*.py" = ["S101"]
"rag-server/tests/*.py" = ["S101"]
# Release 2 review fixtures assert expected validation outcomes only.
"shared/tests/*.py" = ["S101"]
# Cloud regression tests assert guard and persistence expectations.
"scripts/cloud/tests/*.py" = ["S101"]

# Student 3 pytest assertions are test expectations.
"student-3/tests/*.py" = ["S101"]

# Student 3 backend listens on the container network.
"student-3/backend/app.py" = ["S104"]

# Student 3 database API listens on the container network.
"student-3/database/database_api.py" = ["S104"]

# Integrated Docker Compose Configuration

services:
  # Student 3 - Campus Resource Management
  student3-database:
    build:
      context: .
      dockerfile: student-3/database/Dockerfile

    ports:
      - "5004:5004"

  student3-backend:
    build:
      context: .
      dockerfile: student-3/backend/Dockerfile

    ports:
      - "8003:8000"

    environment:
      AI_SERVICE_URL: http://ollama:11434/api/generate
      DATABASE_API_URL: http://student3-database:5004
      RAG_SERVER_URL: http://host.docker.internal:9101
      MCP_SERVER_URL: http://host.docker.internal:9001/mcp

    depends_on:
      - student3-database
      - ollama

  student3-frontend:
    build:
      context: .
      dockerfile: student-3/frontend/Dockerfile

    ports:
      - "8083:80"

    depends_on:
      - student3-backend

  # Student 4 Docker Compose Configuration
  database:
    build:
      context: .
      dockerfile: student-4/database/Dockerfile

    ports:
      - "5002:5002"

    environment:
      DATABASE_PATH: /data/events.db

    volumes:
      - database_data:/data

  backend:
    build:
      context: .
      dockerfile: student-4/backend/Dockerfile

    ports:
      - "8000:8000"

    environment:
      AI_SERVICE_URL: http://ollama:11434/api/generate
      DATABASE_SERVICE_URL: http://database:5002

    depends_on:
      - database
      - ollama

  frontend:
    build:
      context: .
      dockerfile: student-4/frontend/Dockerfile

    ports:
      - "8080:80"

    depends_on:
      - backend

  student1-database:
    build:
      context: ./student-1/database

    ports:
      - "5001:5001"

    environment:
      DATABASE_PATH: /data/courses.db

    volumes:
      - student1-course-data:/data

  student1-backend:
    build:
      context: ./student-1/backend

    ports:
      - "8001:8001"

    environment:
      DATABASE_SERVICE_URL: http://student1-database:5001
      AI_SERVICE_URL: http://ollama:11434/api/generate
      MCP_SERVER_URL: http://host.docker.internal:9001/mcp
      RAG_SERVER_URL: http://host.docker.internal:9101
      MULTI_AGENT_SERVER_URL: http://host.docker.internal:9201
      MULTI_AGENT_TIMEOUT_SECONDS: "390"

    depends_on:
      - student1-database
      - ollama

  student1-frontend:
    build:
      context: ./student-1/frontend

    ports:
      - "8081:80"

    depends_on:
      - student1-backend

  # Student 2 Docker Compose Configuration

  student2-database:
    build:
      context: .
      dockerfile: student-2/database/Dockerfile

    environment:
      DATABASE_PATH: /data/assignments.db

    volumes:
      - assignment_data:/data

    ports:
      - "5005:5002"

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')" ]
      interval: 10s
      timeout: 3s
      retries: 5

  student2-backend:
    build:
      context: .
      dockerfile: student-2/backend/Dockerfile

    environment:
      DATABASE_SERVICE_URL: http://student2-database:5002
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: qwen2.5:0.5b
      RAG_SERVER_URL: http://host.docker.internal:9101
      MULTI_AGENT_SERVER_URL: http://host.docker.internal:9201
      MULTI_AGENT_TIMEOUT_SECONDS: "390"

    ports:
      - "8002:8002"

    depends_on:
      student2-database:
        condition: service_healthy
      ollama:
        condition: service_started

  student2-frontend:
    build:
      context: .
      dockerfile: student-2/frontend/Dockerfile

    ports:
      - "8082:80"

    depends_on:
      - student2-backend

  # Student 5 Configuration

  student5-database:
    build:
      context: .
      dockerfile: ./student-5/database/Dockerfile
    ports:
      - "5006:5005"
    environment:
      DATABASE_PATH: /data/career.db
    volumes:
      - student5-career-data:/data

  student5-backend:
    build:
      context: .
      dockerfile: ./student-5/backend/Dockerfile
    ports:
      - "8005:8005"
    environment:
      AI_SERVICE_URL: http://ollama:11434/api/generate
      DATABASE_PATH: /data/career.db
      MCP_SERVER_URL: http://host.docker.internal:9001/mcp
      RAG_SERVER_URL: http://host.docker.internal:9101
    volumes:
      - student5-career-data:/data
    depends_on:
      - student5-database
      - ollama

  student5-frontend:
    build:
      context: .
      dockerfile: ./student-5/frontend/Dockerfile
    ports:
      - "8085:80"
    depends_on:
      - student5-backend

  # Shared Frontend

  shared-frontend:
    build:
      context: ./shared/frontend
      dockerfile: Dockerfile

    ports:
      - "8888:80"

  # Shared Ollama

  ollama:
    image: ollama/ollama:latest

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      sh -ec " until ollama list >/dev/null 2>&1; do
        echo 'Waiting for Ollama...';
        sleep 2;
      done; echo 'Ensuring qwen2.5:0.5b is available...'; ollama pull qwen2.5:0.5b;
      echo 'Ensuring llama3.1:8b is available...'; ollama pull llama3.1:8b;
      echo 'Ollama models are ready.'; "

volumes:
  database_data:
  ollama_data:
  student1-course-data:
  assignment_data:
  student5-career-data:

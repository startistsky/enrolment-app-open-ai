#Ted
services:

  backend:
    build:
      context: .
      dockerfile: student-4/backend/Dockerfile

    ports:
      - "8000:8000"

    environment:
      AI_SERVICE_URL: http://ollama:11434/api/generate

    depends_on:
      - ollama


  frontend:
    build:
      context: .
      dockerfile: student-4/frontend/Dockerfile

    ports:
      - "8080:80"

    depends_on:
      - backend


  ollama:
    image: ollama/ollama:latest

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama


volumes:
  ollama_data:
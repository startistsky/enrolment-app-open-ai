<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Job Details</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <nav>
      <h2>Career&Internship</h2>

      <div>
        <a href="/">Jobs</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/preferences.html">Preferences</a>
        <a href="/admin.html">Admin</a>
      </div>
    </nav>

    <main>
      <div id="job-details">Loading job...</div>

      <div id="job-message" class="message"></div>

      <div class="actions">
        <button onclick="saveJob()">Save Job</button>

        <button onclick="applyJob()">Apply</button>

        <button onclick="analyseJob()">Analyse with AI</button>
      </div>

      <section class="ai-section">
        <h2>AI Job Analysis</h2>

        <div id="ai-analysis">
          <p>Click "Analyse with AI".</p>
        </div>
      </section>

      <section class="chat">
        <h2>AI Career Assistant</h2>

        <div id="chat-messages"></div>

        <div class="chat-input">
          <input id="chat-input" placeholder="Ask about this job..." />

          <button onclick="sendMessage()">Send</button>
        </div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>

    <script src="{{ url_for('static', filename='js/job.js') }}"></script>
  </body>
</html>

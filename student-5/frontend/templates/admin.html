<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Add Job</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <nav>
      <a class="nav-brand" href="/"> Career&Internship </a>

      <div>
        <a href="/"> Jobs </a>

        <a href="/dashboard.html"> Dashboard </a>

        <a href="/preferences.html"> Preferences </a>

        <a href="/admin.html"> Add Job </a>
      </div>
    </nav>

    <main>
      <h1>Add Job Opportunity</h1>

      <p>Add a job or internship to CareerConnect.</p>

      <form id="job-form">
        <label> Job Title </label>

        <input id="title" required placeholder="Graduate Software Engineer" />

        <label> Company </label>

        <input id="company" required placeholder="Example Technologies" />

        <label> Location </label>

        <input id="location" placeholder="Sydney" />

        <label> Industry </label>

        <select id="industry">
          <option value="">Select Industry</option>

          <option value="Technology">Technology</option>

          <option value="Finance">Finance</option>

          <option value="Marketing">Marketing</option>

          <option value="Healthcare">Healthcare</option>

          <option value="Education">Education</option>
        </select>

        <label> Job Type </label>

        <select id="job-type">
          <option value="">Select Type</option>

          <option value="Internship">Internship</option>

          <option value="Graduate">Graduate</option>

          <option value="Part-time">Part-time</option>

          <option value="Full-time">Full-time</option>
        </select>

        <label> Salary </label>

        <input id="salary" placeholder="$70,000 - $80,000" />

        <label> Description </label>

        <textarea
          id="description"
          placeholder="Describe the opportunity..."
          required
        ></textarea>

        <label> Requirements </label>

        <textarea
          id="requirements"
          placeholder="Python, SQL, communication..."
        ></textarea>

        <label> Application URL </label>

        <input
          id="application-url"
          type="url"
          placeholder="https://example.com/apply"
        />

        <button type="submit">Add Job</button>
      </form>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
  </body>
</html>

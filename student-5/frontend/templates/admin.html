<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin | CareerConnect</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <header class="topbar">
      <a href="/" class="brand">
        <span class="brand-mark"></span>

        <span> CareerConnect </span>
      </a>

      <nav class="nav">
        <a href="/"> Jobs </a>

        <a href="/dashboard.html"> Dashboard </a>

        <a href="/admin.html"> Admin </a>
      </nav>
    </header>

    <main>
      <section class="small-hero">
        <span class="eyebrow"> ADMIN </span>

        <h1>Job Management</h1>

        <p>Create, edit and remove opportunities.</p>
      </section>

      <section>
        <div class="section-head">
          <div>
            <span class="section-label"> JOB MANAGEMENT </span>

            <h2 id="form-title">Add Job</h2>
          </div>
        </div>

        <form id="job-form">
          <div class="form-grid">
            <div class="form-group">
              <label> Job Title </label>

              <input id="title" required />
            </div>

            <div class="form-group">
              <label> Company </label>

              <input id="company" required />
            </div>

            <div class="form-group">
              <label> Location </label>

              <input id="location" />
            </div>

            <div class="form-group">
              <label> Industry </label>

              <input id="industry" />
            </div>

            <div class="form-group">
              <label> Job Type </label>

              <select id="job-type">
                <option value="">Select type</option>

                <option>Internship</option>

                <option>Graduate</option>

                <option>Part-time</option>

                <option>Full-time</option>
              </select>
            </div>

            <div class="form-group">
              <label> Salary </label>

              <input id="salary" />
            </div>
          </div>

          <div class="form-group">
            <label> Description </label>

            <textarea id="description"></textarea>
          </div>

          <div class="form-group">
            <label> Requirements </label>

            <textarea id="requirements"></textarea>
          </div>

          <div class="form-group">
            <label> Application URL </label>

            <input id="application-url" />
          </div>

          <button type="submit" class="primary-button">Save Job</button>

          <button
            type="button"
            id="cancel-edit"
            class="secondary-button"
            style="display: none"
          >
            Cancel Edit
          </button>

          <p id="job-message" class="status-message"></p>
        </form>
      </section>

      <section>
        <div class="section-head">
          <div>
            <span class="section-label"> DATABASE </span>

            <h2>Existing Jobs</h2>
          </div>
        </div>

        <div id="admin-jobs" class="job-grid"></div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>

    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
  </body>
</html>

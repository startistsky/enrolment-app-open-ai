extend-exclude = [".venv*", "venv", "env", "__pycache__", "chroma", "chroma-data", "docker-data", "ollama-data", "*.jsonl"]

[lint]
select = ["S"]

[lint.per-file-ignores]
# pytest assertions are test expectations, never production input validation.
"student-1/tests/*.py" = ["S101"]
"ai-services/multi-agent-server/tests/*.py" = ["S101"]
"rag-server/tests/*.py" = ["S101"]
# Release 2 review fixtures assert expected validation outcomes only.
"shared/tests/*.py" = ["S101"]
# Cloud regression tests assert guard and persistence expectations.
"scripts/cloud/tests/*.py" = ["S101"]

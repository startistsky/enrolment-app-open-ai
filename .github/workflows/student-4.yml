name: Student 4 Release 1 CI

on:
  push:
    paths:
      - "student-4/**"
      - "mcp-server/**"
      - "rag-server/**"
      - "docker-compose.yml"
      - ".github/workflows/student-4.yml"

  pull_request:
    branches:
      - main
    paths:
      - "student-4/**"
      - "mcp-server/**"
      - "rag-server/**"
      - "docker-compose.yml"
      - ".github/workflows/student-4.yml"

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker system prune -af || true
          df -h

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Install Student 4 backend dependencies
      - name: Install Student 4 backend dependencies
        working-directory: student-4
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      # 4. Install shared MCP dependencies
      - name: Install MCP dependencies
        run: |
          pip install -r mcp-server/requirements.txt

      # 5. Install shared RAG dependencies
      - name: Install RAG dependencies
        run: |
          pip install -r rag-server/requirements.txt

      # 6. Run all Student 4 tests
      - name: Run Student 4 tests
        working-directory: student-4
        run: |
          pytest tests/ -v

      # 7. Validate Student 4 MCP Python files
      - name: Validate Student 4 MCP files
        run: |
          python -m py_compile \
            mcp-server/server.py \
            mcp-server/tools/student4_event_tools.py \
            student-4/backend/mcp_client.py

      # 8. Validate Student 4 RAG Python files
      - name: Validate Student 4 RAG files
        run: |
          python -m py_compile \
            rag-server/server.py \
            rag-server/retrievers/student4_event_retriever.py \
            student-4/backend/rag_client.py

      # 9. Build Student 4 Docker images
      - name: Build Student 4 Docker images
        run: |
          docker compose build database backend frontend

      # 10. Start Student 4 services
      - name: Start Student 4 services
        run: |
          docker compose up -d database ollama backend frontend

      # 11. Show container status
      - name: Show running containers
        run: |
          docker compose ps

      # 12. Validate frontend
      - name: Validate Student 4 frontend
        run: |
          for i in {1..8}; do
            echo "Frontend validation attempt $i"

            if curl --fail --silent --show-error http://localhost:8080 > /dev/null; then
              echo "Frontend is ready - HTTP validation passed"
              exit 0
            fi

            if [ "$i" -eq 8 ]; then
              echo "Frontend validation failed after 8 attempts"
              exit 1
            fi

            sleep 5
          done

      # 13. Validate backend
      - name: Validate Student 4 backend
        run: |
          for i in {1..8}; do
            echo "Backend validation attempt $i"

            if curl --fail --silent --show-error http://localhost:8000/health; then
              echo "Backend is ready - HTTP validation passed"
              exit 0
            fi

            if [ "$i" -eq 8 ]; then
              echo "Backend validation failed after 8 attempts"
              exit 1
            fi

            sleep 5
          done

      # 14. Validate database service
      - name: Validate Student 4 database service
        run: |
          for i in {1..8}; do
            echo "Database validation attempt $i"

            if curl --fail --silent --show-error http://localhost:5002/health; then
              echo "Database service is ready - HTTP validation passed"
              exit 0
            fi

            if [ "$i" -eq 8 ]; then
              echo "Database validation failed after 8 attempts"
              exit 1
            fi

            sleep 5
          done

      # 15. Show logs on failure
      - name: Show Docker logs on failure
        if: failure()
        run: |
          echo "===== DATABASE LOGS ====="
          docker compose logs database || true

          echo "===== BACKEND LOGS ====="
          docker compose logs backend || true

          echo "===== FRONTEND LOGS ====="
          docker compose logs frontend || true

          echo "===== OLLAMA LOGS ====="
          docker compose logs ollama || true

      # 16. Tear down containers
      - name: Tear down containers
        if: always()
        run: |
          docker compose down -v
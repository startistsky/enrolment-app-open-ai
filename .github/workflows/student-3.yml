
name: Student 3 Campus Resource CI

on:
  push:
    branches:
      - student_3
      - "feature/student3-*"

  pull_request:
    branches:
      - main

jobs:
  student3-tests:
    name: Student 3 CI
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Student 3 dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-3/tests/requirements.txt

      # Verify Python dependencies
      - name: Check Python dependencies
        run: |
          python -m pip check

      # Check Python syntax
      - name: Check Python syntax
        run: |
          python -m py_compile student-3/backend/app.py
          python -m py_compile student-3/backend/rag_client.py
          python -m py_compile student-3/backend/mcp_client.py
          python -m py_compile student-3/backend/agentic_loop.py
          python -m py_compile student-3/database/database_api.py
          python -m py_compile student-3/database/init_db.py
          python -m py_compile mcp-server/tools/student3_resource_tools.py
          python -m py_compile rag-server/retrievers/student3_resource_retriever.py

      # Run MCP and RAG automated tests
      # Full live-service integration tests are validated locally
      # with Database, Backend, Ollama/Qwen, MCP and RAG running.
      - name: Run automated tests
        run: |
          python -m pytest \
            student-3/tests/test_mcp_integration.py \
            student-3/tests/test_rag_integration.py \
            -v

      # Run Release 2 Multi-Agent regression tests
      - name: Run Student 3 R2 Multi-Agent tests
        run: |
          PYTHONPATH=ai-services/multi-agent-server \
          python -m unittest discover \
            -s ai-services/multi-agent-server/tests \
            -p 'test_resource_agents.py' \
            -v

      # Validate Docker Compose configuration
      - name: Validate Docker Compose
        run: |
          docker compose config

      # Build Student 3 application images
      - name: Build Student 3 database
        run: |
          docker compose build student3-database

      - name: Build Student 3 backend
        run: |
          docker compose build student3-backend

      - name: Build Student 3 frontend
        run: |
          docker compose build student3-frontend

      # Show build evidence
      - name: Show Student 3 Docker images
        run: |
          docker images | grep student3 || true

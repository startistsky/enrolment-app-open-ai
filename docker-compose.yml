# Integrated Docker Compose Configuration

services:

  # Student 3 - Campus Resource Management

  student3-database:
    build:
      context: .
      dockerfile: student-3/database/Dockerfile

    ports:
      - "5004:5004"

  student3-backend:
    build:
      context: .
      dockerfile: student-3/backend/Dockerfile

    ports:
      - "8003:8000"

    environment:
      AI_SERVICE_URL: http://ollama:11434/api/generate
      DATABASE_API_URL: http://student3-database:5004

    depends_on:
      - student3-database
      - ollama

  student3-frontend:
    build:
      context: .
      dockerfile: student-3/frontend/Dockerfile

    ports:
      - "8083:80"

    depends_on:
      - student3-backend


  # Student 4 Docker Compose Configuration

  database:
    build:
      context: .
      dockerfile: student-4/database/Dockerfile

    ports:
      - "5002:5002"

    environment:
      DATABASE_PATH: /data/events.db

    volumes:
      - database_data:/data

  backend:
    build:
      context: .
      dockerfile: student-4/backend/Dockerfile

    ports:
      - "8000:8000"

    environment:
      AI_SERVICE_URL: http://ollama:11434/api/generate
      DATABASE_SERVICE_URL: http://database:5002

    depends_on:
      - database
      - ollama

  frontend:
    build:
      context: .
      dockerfile: student-4/frontend/Dockerfile

    ports:
      - "8080:80"

    depends_on:
      - backend

  student1-database:
    build:
      context: ./student-1/database

    ports:
      - "5001:5001"

    environment:
      DATABASE_PATH: /data/courses.db

    volumes:
      - student1-course-data:/data

  student1-backend:
    build:
      context: ./student-1/backend

    ports:
      - "8001:8001"

    environment:
      DATABASE_SERVICE_URL: http://student1-database:5001
      AI_SERVICE_URL: http://ollama:11434/api/generate

    depends_on:
      - student1-database
      - ollama

  student1-frontend:
    build:
      context: ./student-1/frontend

    ports:
      - "8081:80"

    depends_on:
      - student1-backend

  # Student 5 Docker Compose Configuration
  student5-database:
    build:
      context: .
      dockerfile: student-5/database/Dockerfile

    ports:
      - "5005:5005"

    environment:
      DATABASE_PATH: /data/database.db

    volumes:
      - student5-database-data:/data


  student5-backend:
    build:
      context: .
      dockerfile: student-5/backend/Dockerfile

    ports:
      - "8005:8005"

    environment:
      AI_SERVICE_URL: http://ollama:11434/api/generate
      DATABASE_SERVICE_URL: http://student5-database:5005

    depends_on:
      - student5-database
      - ollama


  student5-frontend:
    build:
      context: .
      dockerfile: student-5/frontend/Dockerfile

    ports:
      - "8085:80"

    depends_on:
      - student5-backend

  # Shared Frontend

  shared-frontend:
    build:
      context: ./shared/frontend
      dockerfile: Dockerfile

    ports:
      - "8888:80"

  # Shared Ollama
  ollama:
    image: ollama/ollama:latest

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama


volumes:
  database_data:
  ollama_data:
  student1-course-data:
  student5-career-data:

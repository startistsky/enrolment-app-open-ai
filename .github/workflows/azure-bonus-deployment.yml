name: Azure Students 1-5 Bonus Deployment

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Reviewed and pushed branch to deploy"
        required: true
        default: feature/azure-bonus-deployment
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-group5-cloud
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Students 1-5 with B1-B4
    runs-on: ubuntu-latest
    environment: azure-assessment
    timeout-minutes: 90

    steps:
      - name: Checkout reviewed Bonus source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_ref }}
          persist-credentials: false

      - name: Validate deployment source
        run: |
          set -Eeuo pipefail

          test -f docker-compose.cloud.yml
          test -f docker-compose.bonus.yml
          test -f scripts/cloud/package_source.py
          test -f scripts/cloud/configure-vm.sh
          test -f scripts/cloud/deploy-azure-vm.sh
          test -f scripts/cloud/health-check.sh
          test -f mcp-server/Dockerfile
          test -f rag-server/Dockerfile.bonus
          test -f ai-services/multi-agent-server/Dockerfile.bonus
          test -f student-5/backend/agent/agent_tools.py
          test -f mcp-server/tools/student1_course_tools.py
          test -f mcp-server/tools/student2_assignment_tools.py
          test -f mcp-server/tools/student4_event_tools.py
          test -f rag-server/retrievers/student1_course_retriever.py
          test -f rag-server/retrievers/student2_assignment_retriever.py
          test -f rag-server/retrievers/student4_event_retriever.py
          test -f rag-server/retrievers/student5_career_retriever.py

          docker compose \
            -f docker-compose.cloud.yml \
            -f docker-compose.bonus.yml \
            config --quiet

          for script in scripts/cloud/*.sh; do
            bash -n "$script"
          done

          python3 -m py_compile scripts/cloud/package_source.py

          echo "GROUP5_BONUS_SOURCE_VALIDATION_PASSED"

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bonus and verify cloud functionality
        env:
          RESOURCE_GROUP: asd-group5-rg
          VM_NAME: asd-group5-vm
          SOURCE_DIR: ${{ github.workspace }}
          HTTP_SOURCE_CIDR: ${{ vars.AZURE_HTTP_SOURCE_CIDR }}
          INCLUDE_BONUS_SERVICES: "true"
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.AZURE_VM_SSH_PUBLIC_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077

          key_file="$(mktemp "$RUNNER_TEMP/group5-bonus-key.XXXXXX")"

          trap 'rm -f -- "$key_file"' EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"

          chmod 600 "$key_file"

          unset SSH_PRIVATE_KEY

          export SSH_PRIVATE_KEY_PATH="$key_file"

          bash scripts/cloud/deploy-azure-vm.sh

      - name: Record Bonus deployment result
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Students 1-5 Azure Bonus B1-B4"
            echo
            echo "Deployment status: $DEPLOY_STATUS"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "A successful workflow requires VM-side functional checks."
          } >> "$GITHUB_STEP_SUMMARY"
